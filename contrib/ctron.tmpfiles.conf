# ctron: group-write on the sysfs nodes ctron writes, so that the everyday
# writes need no `sudo -n tee` rule (SECURITY.md, section 4.6).
#
# Install together with 99-ctron.rules:
#   sudo groupadd --system ctron && sudo usermod -aG ctron "$USER"
#   sudo install -m 644 ctron.tmpfiles.conf /etc/tmpfiles.d/ctron.conf
#   sudo install -m 644 99-ctron.rules /etc/udev/rules.d/99-ctron.rules
#   sudo udevadm control --reload && sudo systemd-tmpfiles --create
# Log out and back in for the group to apply.
#
# Type `z` adjusts the mode and group of files that exist and never
# creates anything; a pattern that matches nothing is fine. To use another
# group, replace it here and in 99-ctron.rules.
#
# This file is applied at boot by systemd-tmpfiles-setup.service, which
# is early enough only for the first block. The ASUS nodes appear later
# (measured on an FA608PP, kernel 7.3.1, systemd 262: tmpfiles had
# finished at 2.2 s, asus_wmi initialised at 5.1 s), so 99-ctron.rules
# runs this file again when they show up.

# CPU frequency ceilings and EPP, global boost: present from the first
# moment of boot
z /sys/devices/system/cpu/cpu*/cpufreq/scaling_max_freq               0660 root ctron -
z /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference 0660 root ctron -
z /sys/devices/system/cpu/cpufreq/boost                               0660 root ctron -

# Platform profile
z /sys/firmware/acpi/platform_profile                                 0660 root ctron -

# asus-nb-wmi platform attributes: the legacy PPT nodes, panel overdrive,
# NVIDIA dynamic boost and temperature target
z /sys/devices/platform/asus-nb-wmi/ppt_pl1_spl                       0660 root ctron -
z /sys/devices/platform/asus-nb-wmi/ppt_pl2_sppt                      0660 root ctron -
z /sys/devices/platform/asus-nb-wmi/ppt_fppt                          0660 root ctron -
z /sys/devices/platform/asus-nb-wmi/nv_dynamic_boost                  0660 root ctron -
z /sys/devices/platform/asus-nb-wmi/nv_temp_target                    0660 root ctron -
z /sys/devices/platform/asus-nb-wmi/panel_od                          0660 root ctron -

# PPT through the asus-armoury firmware attributes (where the firmware
# supports them)
z /sys/class/firmware-attributes/asus-armoury/attributes/ppt_pl*/current_value 0660 root ctron -

# Battery charge limit
z /sys/class/power_supply/BAT*/charge_control_end_threshold           0660 root ctron -

# Not in this file, on purpose:
#  - the fan-curve points: their hwmon's sibling carries files with the
#    same names, so 99-ctron.rules grants exactly that one device's files
#  - the keyboard backlight: other tools (OpenRGB's udev rule) may open
#    that node wider; ctron must not narrow it under them
